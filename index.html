<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Ultra Pro Casino & Fortune Spin</title>
    <style>
        body { 
            background: #090d16; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 10px; 
            margin: 0;
        }
        .app-container { 
            max-width: 420px; 
            margin: 20px auto; 
            background: #111827; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border: 1px solid #1f2937;
        }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1f2937; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; }
        .wallet { color: #facc15; font-weight: bold; font-size: 16px; }
        
        /* जैकपॉट बैनर */
        .jackpot-box { 
            background: linear-gradient(135deg, #b45309, #d97706); 
            padding: 10px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            font-weight: bold;
            font-size: 14px;
            color: #fef3c7;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.3);
        }

        .game-section { background: #1f2937; padding: 15px; border-radius: 14px; margin-top: 15px; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 10px; 
            border: none; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-spin { background: linear-gradient(90deg, #ec4899, #8b5cf6); color: white; box-shadow: 0 4px 15px rgba(236,72,153,0.4); }
        .btn-spin:active { transform: scale(0.98); }
        
        .wheel-display {
            font-size: 32px;
            margin: 15px 0;
            background: #374151;
            padding: 20px;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            border: 4px dashed #facc15;
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { border-color: #facc15; box-shadow: 0 0 5px #facc15; }
            to { border-color: #ec4899; box-shadow: 0 0 20px #ec4899; }
        }
        #resultMsg { font-size: 15px; margin-top: 10px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- टॉप बार -->
        <div class="header">
            <span>🔥 <b>FORTUNE PRO VIP</b></span>
            <div class="wallet">💰 ₹<span id="balance">500</span></div>
        </div>

        <!-- जैकपॉट अलर्ट -->
        <div class="jackpot-box">
            💎 GRAND JACKPOT: ₹2,50,000[cite: 5]
        </div>

        <!-- फॉर्च्यून स्पिन गेम -->
        <div class="game-section">
            <h3>🎡 Wheel of Fortune Spin</h3>
            <p style="font-size: 13px; color: #9ca3af;">लकी व्हील घुमाओ और बड़ा मल्टीप्लायर जीतो!</p>
            
            <div class="wheel-display" id="wheelIcon">🎰</div>
            
            <button class="btn-spin" onclick="spinWheel()">स्पिन करें (दांव: ₹50)</button>
            <div id="resultMsg"></div>
        </div>
    </div>

    <script>
        let userBalance = 500;
        const multipliers = ["0x (हार गए)", "2x (₹100 जीते)", "5x (₹250 जीते)", "10x (₹500 जीते)", "0x (हार गए)", "20x (₹1000 जैकपॉट!)"];

        function spinWheel() {
            if (userBalance < 50) {
                alert("⚠️ वॉलेट में पर्याप्त बैलेंस नहीं है! कृपया पहले डिपॉजिट करें।");
                return;
            }

            // बेट राशि काटना
            userBalance -= 50;
            document.getElementById('balance').innerText = userBalance;
            
            const msg = document.getElementById('resultMsg');
            const wheel = document.getElementById('wheelIcon');
            msg.style.color = "#facc15";
            msg.innerText = "🔄 व्हील घूम रहा है...";
            wheel.style.transform = "rotate(360deg)";

            setTimeout(() => {
                wheel.style.transform = "rotate(0deg)";
                // रैंडम परिणाम चुनना
                const randomIndex = Math.floor(Math.random() * multipliers.length);
                const outcome = multipliers[randomIndex];

                if (randomIndex === 1) {
                    userBalance += 100;
                    msg.style.color = "#34d399";
                    msg.innerText = `🎉 बधाई हो! ${outcome}`;
                } else if (randomIndex === 2) {
                    userBalance += 250;
                    msg.style.color = "#34d399";
                    msg.innerText = `🔥 शानदार! ${outcome}`;
                } else if (randomIndex === 3) {
                    userBalance += 500;
                    msg.style.color = "#34d399";
                    msg.innerText = `⚡ बहुत बड़ा इनाम! ${outcome}`;
                } else if (randomIndex === 5) {
                    userBalance += 1000;
                    msg.style.color = "#f43f5e";
                    msg.innerText = `👑 जैकपॉट लग गया! ${outcome}`;
                } else {
                    msg.style.color = "#f87171";
                    msg.innerText = `❌ ओहो! ${outcome}`;
                }

                document.getElementById('balance').innerText = userBalance;
            }, 1000);
        }
    </script>
</body>
</html>
