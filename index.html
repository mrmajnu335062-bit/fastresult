<!DOCTYPE html>

        header {

        .card-title {
            font-size: 18px;

        }
        .card-time {

        }
        .card-result {
            font-size: 22px;
            font-weight: bold;
            color: #b30000;
            background: #ffe6e6;
            padding: 8px 15px;
            border-radius: 5px;
        }
        footer {
