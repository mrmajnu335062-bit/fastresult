<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASTRESULT.ONLINE - Live Color & Number Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #d32f2f, #388e3c);
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .tagline {
            font-size: 13px;
            margin-top: 5px;
            color: #ffffff;
        }
        .container {
            width: 95%;
            max-width: 500px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .timer-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px dashed #ffeb3b;
        }
        .timer-title {
            font-size: 14px;
            color: #aaa;
        }
        .countdown {
            font-size: 32px;
            font-weight: bold;
            color: #ffeb3b;
            margin-top: 5px;
        }
        .result-display {
            background: #333;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .winning-number {
            font-size: 40px;
            font-weight: bold;
            color: #4caf50;
            background: #fff;
            width: 70px;
            height: 70px;
            line-height: 70px;
            margin: 10px auto;
            border-radius: 50%;
            box-shadow: 0 0 10px #4caf50;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .btn-green { background-color: #388e3c; }
        .btn-violet { background-color: #7b1fa2; }
        .btn-red { background-color: #d32f2f; }
        
        .number-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .num-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .num-btn:hover {
            background: #555;
        }
        footer {
            margin-top: 30px;
            padding: 15px;
            background: #000;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FASTRESULT.ONLINE ⚡</div>
        <div class="tagline">Live Color & Number Prediction Game Portal</div>
    </header>

    <div class="container">
        
        <!-- Timer Section -->
        <div class="timer-box">
            <div class="timer-title">Next Draw Result In</div>
            <div class="countdown" id="timer">01:00</div>
        </div>

        <!-- Latest Result Section -->
        <div class="result-display">
            <div style="font-size: 14px; color: #ccc;">Last Winning Result</div>
            <div class="winning-number">7</div>
            <div style="font-size: 15px; color: #ffeb3b; font-weight: bold;">Green / Big</div>
        </div>

        <!-- Color Betting Buttons -->
        <div class="btn-group">
            <button class="btn btn-green">GREEN</button>
            <button class="btn btn-violet">VIOLET</button>
            <button class="btn btn-red">RED</button>
        </div>

        <!-- Number Selection (1 to 10/0) -->
        <div style="text-align: left; font-size: 14px; margin-bottom: 8px; color: #aaa;">Select Number (0 to 9):</div>
        <div class="number-grid">
            <button class="num-btn">1</button>
            <button class="num-btn">2</button>
            <button class="num-btn">3</button>
            <button class="num-btn">4</button>
            <button class="num-btn">5</button>
            <button class="num-btn">6</button>
            <button class="num-btn">7</button>
            <button class="num-btn">8</button>
            <button class="num-btn">9</button>
            <button class="num-btn">0</button>
        </div>

    </div>

    <footer>
        &copy; 2026 FastResult.Online | All Rights Reserved
    </footer>

    <script>
        // Simple Countdown Timer Script
        let timeLeft = 60;
        const timerElement = document.getElementById('timer');
        setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerElement.innerHTML = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 60; // Reset timer
            }
        }, 1000);
    </script>

</body>
</html>
